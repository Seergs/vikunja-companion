# Example: run the companion in front of an existing Vikunja instance.
#
# The companion is optional. It is a transparent reverse proxy to Vikunja that
# also serves its own features under /companion/v1/*. Notification delivery is
# delegated to Apprise (the user runs apprise-api) — the companion has no push
# infrastructure of its own.

services:
  companion:
    image: ghcr.io/seergs/vikunja-companion:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      COMPANION_PUBLIC_URL: https://companion.example.com
      VIKUNJA_UPSTREAM_URL: http://vikunja:3456
      COMPANION_MASTER_KEY: ${COMPANION_MASTER_KEY:?set COMPANION_MASTER_KEY}
      COMPANION_DB_PATH: /data/companion.db
      COMPANION_LOG_LEVEL: info
    volumes:
      - companion-data:/data

volumes:
  companion-data:
